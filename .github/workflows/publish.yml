name: Publish

# Decision: Zack chose on 2026-11-25 to publish to GitHub Packages instead of npm. Agent sessions can't push
# tags, so a version bump on main releases that version, and the run tags it when the tag is missing.
# Run it by hand to publish the version on main again if it isn't on GitHub Packages yet.

on:
  push:
    branches: [main]
    paths:
      - 'typescript/packages/*/package.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: typescript
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_USERCONFIG: /tmp/github-packages.npmrc
      REGISTRY: https://npm.pkg.github.com
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Sign in to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > "$NPM_CONFIG_USERCONFIG"
      - name: Find the version to release
        id: version
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          for f in packages/*/package.json; do
            v=$(node -p "require('./$f').version")
            [ "$v" = "$version" ] || { echo "$f is $v, packages/core is $version"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@builtbyfriends/realtime@$version" version --registry "$REGISTRY" >/dev/null 2>&1; then
            echo "$version is already on GitHub Packages, so there's nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.publish == 'true'
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@11
      - if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: bun run check
      - if: steps.version.outputs.publish == 'true'
        run: bun run build
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --workspaces
      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG is already tagged."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi
