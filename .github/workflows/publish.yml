name: Publish

# Push a tag like v0.1.1 to publish every package in typescript/packages to npm.
# It uses npm trusted publishing, so there's no token to store. Each package
# needs this repo and workflow added as a trusted publisher on npmjs.com once.

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Check the tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in packages/*/package.json; do
            v=$(node -p "require('./$f').version")
            [ "$v" = "$tag" ] || { echo "$f is $v, tag is $tag"; exit 1; }
          done
      - run: npm publish --workspaces --access public --provenance
